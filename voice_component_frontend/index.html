<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {

    width: 100%;
    min-height: 250px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    padding: 20px;
}


/* ============================================================
   GREEN VOICE ANIMATION
   ============================================================ */

.voice-animation {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;
}


.bar {

    width: 6px;

    height: 18px;

    border-radius: 10px;

    background: #20d489;

    box-shadow:
        0 0 12px rgba(32, 212, 137, 0.65);

    transition: 0.2s;
}


.voice-animation.active .bar {

    animation:
        voiceWave
        0.9s
        infinite
        ease-in-out;
}


.bar:nth-child(1) {
    animation-delay: 0.00s;
}

.bar:nth-child(2) {
    animation-delay: 0.10s;
}

.bar:nth-child(3) {
    animation-delay: 0.20s;
}

.bar:nth-child(4) {
    animation-delay: 0.30s;
}

.bar:nth-child(5) {
    animation-delay: 0.40s;
}

.bar:nth-child(6) {
    animation-delay: 0.30s;
}

.bar:nth-child(7) {
    animation-delay: 0.20s;
}

.bar:nth-child(8) {
    animation-delay: 0.10s;
}


@keyframes voiceWave {

    0%,
    100% {

        height: 18px;

        opacity: 0.45;
    }

    50% {

        height: 62px;

        opacity: 1;
    }
}


/* ============================================================
   STATUS
   ============================================================ */

.status {

    color: #20d489;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 1.5px;

    text-align: center;
}


.hint {

    color: #81938c;

    font-size: 12px;

    text-align: center;
}


/* ============================================================
   BUTTON
   ============================================================ */

button {

    border: 1px solid #245c4a;

    background: #0d1918;

    color: white;

    border-radius: 14px;

    padding: 13px 28px;

    min-width: 190px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.25s;
}


button:hover {

    border-color: #20d489;

    box-shadow:
        0 0 18px
        rgba(32, 212, 137, 0.30);
}


button.running {

    background: #123c30;

    border-color: #20d489;
}


button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

</style>

</head>


<body>


<div class="container">


    <!-- GREEN VOICE ANIMATION -->

    <div
        id="voiceAnimation"
        class="voice-animation"
    >

        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    >
        READY TO LISTEN
    </div>


    <!-- START / STOP -->

    <button id="toggle">

        START VOICE MODE

    </button>


    <div
        id="hint"
        class="hint"
    >
        Tap once and speak naturally
    </div>


</div>


<script src="https://unpkg.com/streamlit-component-lib/dist/index.js"></script>


<script>

const Streamlit = window.Streamlit;


const animation =
    document.getElementById(
        "voiceAnimation"
    );


const statusEl =
    document.getElementById(
        "status"
    );


const button =
    document.getElementById(
        "toggle"
    );


const hint =
    document.getElementById(
        "hint"
    );


/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let running = false;

let busy = false;

let finalText = "";

let args = {

    running: false,

    language: "ta-IN",

    audio_b64: "",

    status: "READY TO LISTEN"

};


/* ============================================================
   SEND DATA TO STREAMLIT
   ============================================================ */

function sendToPython(
    text = "",
    runningState = running
) {

    const eventId =
        Date.now().toString()
        +
        Math.random()
            .toString(16)
            .substring(2);


    Streamlit.setComponentValue({

        text: text.trim(),

        running: runningState,

        event_id: eventId

    });

}


/* ============================================================
   UI
   ============================================================ */

function updateUI() {

    if (running) {

        animation.classList.add(
            "active"
        );

        button.classList.add(
            "running"
        );

        button.textContent =
            "STOP VOICE MODE";

        statusEl.textContent =
            "LISTENING...";

        hint.textContent =
            "Speak naturally • FRIDAY is listening";

    }

    else {

        animation.classList.remove(
            "active"
        );

        button.classList.remove(
            "running"
        );

        button.textContent =
            "START VOICE MODE";

        statusEl.textContent =
            args.status ||
            "READY TO LISTEN";

        hint.textContent =
            "Tap once and speak naturally";

    }

}


/* ============================================================
   CREATE RECOGNITION
   ============================================================ */

function createRecognition() {

    if (!SpeechRecognition) {

        statusEl.textContent =
            "VOICE NOT SUPPORTED";

        button.disabled = true;

        return null;
    }


    const r =
        new SpeechRecognition();


    r.lang =
        args.language ||
        "ta-IN";


    r.interimResults = true;

    r.continuous = false;

    r.maxAlternatives = 1;


    r.onstart = function() {

        finalText = "";

        busy = false;

        statusEl.textContent =
            "LISTENING...";

        animation.classList.add(
            "active"
        );

    };


    r.onresult = function(event) {

        let interim = "";


        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const text =
                event.results[i][0]
                    .transcript;


            if (
                event.results[i].isFinal
            ) {

                finalText +=
                    text + " ";

            }

            else {

                interim += text;

            }

        }


        if (
            (finalText + interim)
                .trim()
        ) {

            statusEl.textContent =
                "LISTENING...";

        }

    };


    r.onerror = function(event) {

        if (
            event.error ===
            "not-allowed"
        ) {

            running = false;

            updateUI();

            statusEl.textContent =
                "MICROPHONE PERMISSION REQUIRED";

            return;
        }


        if (
            running &&
            !busy
        ) {

            setTimeout(
                startRecognition,
                500
            );

        }

    };


    r.onend = function() {

        if (!running) {

            return;

        }


        const text =
            finalText.trim();


        if (text) {

            busy = true;

            statusEl.textContent =
                "THINKING...";


            sendToPython(
                text,
                true
            );

        }

        else {

            setTimeout(
                startRecognition,
                300
            );

        }

    };


    return r;

}


/* ============================================================
   START RECOGNITION
   ============================================================ */

function startRecognition() {

    if (
        !running ||
        busy
    ) {

        return;

    }


    if (!recognition) {

        recognition =
            createRecognition();

    }


    if (!recognition) {

        return;

    }


    try {

        recognition.start();

    }

    catch (error) {

        setTimeout(
            function() {

                try {

                    recognition.start();

                }

                catch (_) {}

            },
            400
        );

    }

}


/* ============================================================
   STOP
   ============================================================ */

function stopVoice() {

    running = false;

    busy = false;


    if (recognition) {

        try {

            recognition.stop();

        }

        catch (_) {}

    }


    sendToPython(
        "",
        false
    );


    updateUI();

}


/* ============================================================
   START
   ============================================================ */

function startVoice() {

    running = true;

    busy = false;


    sendToPython(
        "",
        true
    );


    updateUI();


    setTimeout(
        startRecognition,
        300
    );

}


/* ============================================================
   BUTTON
   ============================================================ */

button.onclick = function() {

    if (running) {

        stopVoice();

    }

    else {

        startVoice();

    }

};


/* ============================================================
   STREAMLIT RENDER
   ============================================================ */

Streamlit.events.addEventListener(
    Streamlit.RENDER_EVENT,
    function(event) {

        args =
            event.detail.args ||
            args;


        /*
         * Do NOT overwrite local running
         * state unnecessarily.
         */

        if (
            args.running === false
            &&
            running
        ) {

            return;

        }


        if (
            args.running === true
            &&
            !running
        ) {

            running = true;

            busy = false;

            updateUI();

            setTimeout(
                startRecognition,
                300
            );

            return;

        }


        updateUI();

    }
);


/* ============================================================
   COMPONENT READY
   ============================================================ */

Streamlit.setComponentReady();

Streamlit.setFrameHeight(
    250
);


updateUI();

</script>


</body>

</html>
